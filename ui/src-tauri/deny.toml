# 桌面壳依赖策略：漏洞公告、许可证 allowlist、依赖来源白名单。
# 许可证 allowlist 只列实测出现的宽松许可证；更强 copyleft 仍会被阻断。

[advisories]
# 只对工作区直接依赖的“停止维护”公告阻断；tauri/zbus 链上的传递公告
# 由上游统一升级处理（漏洞公告仍全量阻断）。
unmaintained = "workspace"

[bans]
# tauri 依赖链上游存在无法消除的重复版本，阻断会长期误伤；显式保留为告警。
multiple-versions = "warn"
wildcards = "deny"

[sources]
# 只信任 crates.io 与显式登记的 git 源，未知来源直接阻断。
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
