[package]
name = "siku-desktop"
version = "0.1.0"
description = "siku 桌面壳：窗口与内核 sidecar 生命周期，业务数据一律经 localhost HTTP API"
edition = "2021"
rust-version = "1.77"

# 桌面壳为 Rust 业务零逻辑的适配层（ADR-0001）：crate 只做进程/窗口编排
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 平台正确的应用数据目录（macOS Application Support / Windows Roaming / Linux XDG）
dirs = "5"
# 健康检查仅打 loopback，用 rustls 避免 OpenSSL 交叉编译负担
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }
