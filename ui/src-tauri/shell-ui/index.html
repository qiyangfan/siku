<!doctype html>
<html lang="zh-CN" data-mantine-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>siku 四库</title>
    <!-- 与主应用共用主题存储；auto 状态跟随系统偏好。 -->
    <script>
try {
  var _colorScheme = window.localStorage.getItem("mantine-color-scheme-value");
  var colorScheme = _colorScheme === "light" || _colorScheme === "dark" || _colorScheme === "auto" ? _colorScheme : "auto";
  var computedColorScheme = colorScheme !== "auto" ? colorScheme : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-mantine-color-scheme", computedColorScheme);
} catch (e) {}
</script>
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10161d" media="(prefers-color-scheme: dark)" />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        --color-ink: #182230;
        --color-ink-soft: #47525f;
        --color-canvas: #f6f8fb;
        --color-surface: #ffffff;
        --color-border: #dce3ec;
        --color-border-strong: #c5cfdd;
        --color-accent: #2457d6;
        --color-danger: #a43d3d;
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.5rem;
        --font-small: 0.875rem;
        --font-body: 1rem;
        --font-subtitle: 1.125rem;
        --line-body: 1.65;
        --line-heading: 1.3;
        --line-control: 1.25;
        --radius-sm: 0.5rem;
        --radius-md: 0.875rem;
        --radius-circle: 50%;
        --control-height: 2.75rem;
        --border-width: 0.0625rem;
        --border-width-strong: 0.1875rem;
        --focus-outline-width: 0.1875rem;
        --focus-outline-offset: 0.125rem;
        --shadow-card: 0 0.75rem 2rem rgb(24 34 48 / 0.06);
      }
      /* 暗色值与主应用一致，由初始化脚本设置主题属性。 */
      :root[data-mantine-color-scheme="dark"] {
        color-scheme: dark;
        --color-ink: #e6ecf3;
        --color-ink-soft: #a7b3c2;
        --color-canvas: #10161d;
        --color-surface: #182230;
        --color-border: #2a3644;
        --color-border-strong: #3a4a5c;
        --color-accent: #5e8af2;
        --color-danger: #e29a99;
        --shadow-card: 0 0.75rem 2rem rgb(0 0 0 / 0.35);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-canvas);
        color: var(--color-ink);
        font-size: var(--font-body);
        line-height: var(--line-body);
      }
      .card {
        width: min(420px, 84vw);
        text-align: center;
      }
      .logo {
        display: inline-flex;
        gap: var(--space-2);
        margin-bottom: var(--space-5);
      }
      .logo span {
        width: 1.25rem;
        height: 1.25rem;
        border-radius: var(--radius-sm);
        background: var(--color-ink);
      }
      .logo span:first-child {
        background: var(--color-accent);
      }
      h1 {
        font-size: var(--font-subtitle);
        line-height: var(--line-heading);
        margin: 0 0 var(--space-2);
      }
      #status {
        color: var(--color-ink-soft);
        font-size: var(--font-small);
        margin: 0;
      }
      .spinner {
        width: 1.75rem;
        height: 1.75rem;
        margin: var(--space-5) auto 0;
        border: var(--border-width-strong) solid var(--color-border-strong);
        border-top-color: var(--color-accent);
        border-radius: var(--radius-circle);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #error {
        display: none;
        background: var(--color-surface);
        border: var(--border-width) solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-5);
        box-shadow: var(--shadow-card);
      }
      #error h2 {
        font-size: var(--font-body);
        margin: 0 0 var(--space-2);
        color: var(--color-danger);
      }
      #error p {
        font-size: var(--font-small);
        color: var(--color-ink-soft);
        line-height: var(--line-body);
        margin: 0 0 var(--space-4);
      }
      .actions {
        display: flex;
        gap: var(--space-3);
        justify-content: center;
      }
      button {
        min-width: 6rem;
        min-height: var(--control-height);
        padding-inline: var(--space-4);
        border-radius: var(--radius-sm);
        border: var(--border-width) solid var(--color-border-strong);
        background: var(--color-surface);
        color: var(--color-ink);
        font-size: var(--font-small);
        line-height: var(--line-control);
        cursor: pointer;
      }
      button.primary {
        background: var(--color-accent);
        border-color: var(--color-accent);
        color: var(--color-surface);
      }
      button:hover {
        opacity: 0.9;
      }
      button:focus-visible {
        outline: var(--focus-outline-width) solid var(--color-accent);
        outline-offset: var(--focus-outline-offset);
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo"><span></span><span></span><span></span><span></span></div>
      <h1>siku 四库</h1>
      <p id="status" role="status" aria-live="polite">正在启动本地服务…</p>
      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <div id="error" role="alert" aria-live="assertive">
        <h2 id="error-title">无法启动本地服务</h2>
        <p id="error-message"></p>
        <div class="actions">
          <button class="primary" id="retry">重新启动本地服务</button>
          <button id="quit">退出</button>
        </div>
      </div>
    </div>
    <script>
      // 重试通过重载页面触发 Rust 重新启动 sidecar。
      const { listen } = window.__TAURI__.event;
      const statusEl = document.getElementById("status");
      const spinnerEl = document.getElementById("spinner");
      const errorEl = document.getElementById("error");
      const errorTitleEl = document.getElementById("error-title");
      const messageEl = document.getElementById("error-message");
      const retryEl = document.getElementById("retry");

      const recovery = new URLSearchParams(window.location.search).get("recovery") === "1";
      if (recovery) {
        showError("本地服务已停止或长时间无响应。重新启动后，应用会先确认服务就绪。");
        errorTitleEl.textContent = "本地服务已停止";
      }

      retryEl.addEventListener("click", () => {
        if (recovery) {
          const startupUrl = new URL(window.location.href);
          startupUrl.searchParams.delete("recovery");
          window.location.replace(startupUrl.toString());
          return;
        }
        window.location.reload();
      });
      document.getElementById("quit").addEventListener("click", () =>
        window.__TAURI__.window.getCurrentWindow().close(),
      );

      function showError(message) {
        statusEl.hidden = true;
        spinnerEl.style.display = "none";
        errorEl.style.display = "block";
        messageEl.textContent = message;
      }

      listen("siku-startup", (event) => {
        const payload = event.payload;
        if (payload.state === "starting") {
          statusEl.textContent = "正在启动本地服务…";
        } else if (payload.state === "succeeded") {
          // 问答页由 sidecar 提供，业务请求仍经 HTTP API。
          window.location.replace(payload.url);
        } else if (payload.state === "failed") {
          showError(payload.message);
        }
      });
    </script>
  </body>
</html>
