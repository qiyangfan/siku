[project]
name = "siku"
version = "0.1.0"
description = "siku（四库）—— 本地优先的个人知识库：万能摄取、知识图谱、LLM wiki、自然语言问答"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # 资料库导入端点的 multipart 解析（FastAPI 文件上传官方必需件，纯解析轻依赖）
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # 应用异常映射直接 catch StarletteHTTPException（覆盖 FastAPI 子类），
    # 属直接 import，必须声明为一等依赖（deptry DEP003）
    "starlette>=0.40",
    "typer>=0.12",
    # 图谱依赖：内存图、parquet 本体读写和 OpenAI 兼容 LLM 通道。
    # 三者均为轻依赖，不引入 torch 系重依赖与 server 形态组件（架构红线 #4、ADR-0003）
    "httpx>=0.27",
    "networkx>=3.3",
    "pyarrow>=17.0",
    # LanceDB 向量存储（ADR-0003 三件套；ADR-0009 后模型经 BYOK 端点供给，
    # 内核不再含任何 torch 系重依赖）
    "lancedb>=0.20",
    # 默认格式摄取运行时（ADR-0013）：轻量解析库进核心，不含 torch 系依赖。
    # PDF 用 pypdf 公开文本提取；PPTX/XLSX 用 python-pptx/openpyxl
    "pypdf>=5.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    # 同库写入跨进程互斥；锁文件位于 vault/.siku/，不进入语料清单。
    "filelock>=3.16",
    "mcp>=2,<3",
]

[project.scripts]
siku = "siku.cli:app"

[project.optional-dependencies]
# 重依赖抽取引擎一律放 extras，保持核心安装轻量（架构红线 #4）。
# 默认 PDF 使用核心 pypdf；Docling 作为可选的重型解析后端，不进入桌面构建。
ingest-pdf = ["docling>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    # 桌面 sidecar 打包：仅构建期需要
    "pyinstaller>=6.10",
    # 测试专用 PDF 夹具生成（含中文 CID 字体）；不进运行时依赖
    "reportlab>=4.0",
    "pylint>=3.3",
    "import-linter>=2.0",
    # 死代码门禁（knip 的 Python 对应物）：与 knip 同口径只报高置信命中
    "vulture>=2.14",
    # 依赖卫生：未声明/未使用/传递依赖直接 import 三类问题
    "deptry>=0.23",
    # 依赖审计的漏洞扫描件与工作流安全审计（P0-2 / P0-5）
    "pip-audit>=2.9",
    "zizmor>=1.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siku"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
ignore = [
    # 中文文本合法使用全角标点，"易混淆字符"检查不适用本项目（RUF001/2/3）
    "RUF001",
    "RUF002",
    "RUF003",
]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff 专属规则
    # 结构门禁取 ruff 默认阈值（与 kongming 同口径）：圈复杂度 10、分支 12、语句 50
    "C901",
    "PLR0912",
    "PLR0915",
    # 性能与返回/导入卫生（均为默认规则集，无自定义参数）
    "PERF",
    "RET",
    "TID",
    "ICN",
    "PLR0402", # 子模块只用 from 导入，禁止 import x.y as y 形式的别名
    "S",   # flake8-bandit 安全规则（P0-3 SAST 的 Python 侧）
]

[tool.ruff.lint.per-file-ignores]
# 测试代码只处理本地夹具：断言是测试惯用法，临时目录/pickle/子进程启动
# 均不接收不受信输入。生产代码不放行任何 S 规则。
"tests/**" = ["S101", "S104", "S105", "S106", "S107", "S108", "S301", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 告警即失败：全量实测零告警；防止新依赖/新代码把弃用警告带进 CI。
filterwarnings = ["error"]
# e2e（真实 serve 进程接线冒烟）默认排除，由 CI 独立 job 经 `pytest -m e2e` 运行。
addopts = "-q -m 'not e2e'"
markers = [
    "e2e: 真实 serve 进程五段接线回归冒烟（独立 CI job 运行；fake 三通道端点，无网络无密钥）",
]

[tool.mypy]
python_version = "3.12"
# tests 统一用 `tests.xxx` 包限定导入（namespace package），
# explicit_package_bases 让 mypy 与 pytest（pythonpath=.）解析口径一致。
# scripts/benchmarks 同属可执行代码，一并纳入检查面。
files = ["src", "tests", "scripts", "benchmarks"]
mypy_path = ["src"]
explicit_package_bases = true
disallow_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["siku"]
branch = true

[tool.coverage.report]
show_missing = true
# 基线 89.97%（行+分支合计，向下取整）；只降不升由门禁保证。
fail_under = 89

# 架构边界（红线 #2/#4 的依赖面）：底层模块不得反向依赖入口层/编排层。
[tool.importlinter]
root_packages = ["siku"]

[[tool.importlinter.contracts]]
name = "抽取器不依赖其他内核模块（ADR-0005 可插拔边界）"
type = "forbidden"
source_modules = ["siku.extractors"]
forbidden_modules = [
    "siku.api",
    "siku.cli",
    "siku.graph",
    "siku.ingest",
    "siku.mcp",
    "siku.model_supply",
    "siku.qa",
    "siku.retrieve",
    "siku.sidecar",
    "siku.sync",
    "siku.wiki",
]

[[tool.importlinter.contracts]]
name = "内核模块不反向依赖入口层与同步编排"
type = "forbidden"
source_modules = [
    "siku.ingest",
    "siku.retrieve",
    "siku.graph",
    "siku.wiki",
    "siku.qa",
    "siku.model_supply",
]
forbidden_modules = ["siku.api", "siku.cli", "siku.mcp", "siku.sidecar", "siku.sync"]

[[tool.importlinter.contracts]]
name = "检索内核不依赖摄取与同步"
type = "forbidden"
source_modules = ["siku.retrieve"]
forbidden_modules = ["siku.ingest", "siku.sync"]

# 死代码：只认高置信命中（80%），60% 档会把 pydantic model_config、
# 框架注册函数等动态引用误报（实测 15 条噪音）
[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.deptry]
# 合法例外：python-multipart 仅供 FastAPI multipart 解析、无 Python import；
# docling 只经可选 extra 的动态导入接入，二者都不应写死导入点
per_rule_ignores = { DEP002 = ["python-multipart", "docling"] }
package_module_name_map = { docling = "docling" }
