[project]
name = "siku"
version = "0.1.0"
description = "siku（四库）—— 本地优先的个人知识库：万能摄取、知识图谱、LLM wiki、自然语言问答"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # 资料库导入端点的 multipart 解析（FastAPI 文件上传官方必需件，纯解析轻依赖）
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    # 图谱依赖：内存图、parquet 本体读写和 OpenAI 兼容 LLM 通道。
    # 三者均为轻依赖，不引入 torch 系重依赖与 server 形态组件（架构红线 #4、ADR-0003）
    "httpx>=0.27",
    "networkx>=3.3",
    "pyarrow>=17.0",
    # LanceDB 向量存储（ADR-0003 三件套；ADR-0009 后模型经 BYOK 端点供给，
    # 内核不再含任何 torch 系重依赖）
    "lancedb>=0.20",
    # 默认格式摄取运行时（ADR-0013）：轻量解析库进核心，不含 torch 系依赖。
    # PDF 用 pypdf 公开文本提取；PPTX/XLSX 用 python-pptx/openpyxl
    "pypdf>=5.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    # 同库写入跨进程互斥；锁文件位于 vault/.siku/，不进入语料清单。
    "filelock>=3.16",
    "mcp>=2,<3",
]

[project.scripts]
siku = "siku.cli:app"

[project.optional-dependencies]
# 重依赖抽取引擎一律放 extras，保持核心安装轻量（架构红线 #4）。
# 默认 PDF 使用核心 pypdf；Docling 作为可选的重型解析后端，不进入桌面构建。
ingest-pdf = ["docling>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    # 桌面 sidecar 打包：仅构建期需要
    "pyinstaller>=6.10",
    # 测试专用 PDF 夹具生成（含中文 CID 字体）；不进运行时依赖
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siku"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
ignore = [
    # 中文文本合法使用全角标点，"易混淆字符"检查不适用本项目（RUF001/2/3）
    "RUF001",
    "RUF002",
    "RUF003",
]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff 专属规则
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
disallow_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true
