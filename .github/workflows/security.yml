# 安全与供应链门禁：secret 全历史扫描 + Python/Rust/JS 依赖漏洞。
# 独立于 ci.yml 的路径门控——安全作业不允许被路径过滤跳过（跨仓质量门禁约定）。
name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # 全历史扫描：只在增量提交里找密钥会漏掉历史遗留
          fetch-depth: 0

      - name: gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          ASSET="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/${ASSET}" -o "/tmp/${ASSET}"
          curl -sSfL "${BASE}/gitleaks_${VERSION}_checksums.txt" -o /tmp/gitleaks.sha256
          # 校验和与产物同源发布：拦下载损坏与发布元数据不一致，不覆盖上游被攻破
          (cd /tmp && sha256sum -c <(grep "  ${ASSET}\$" gitleaks.sha256))
          tar -xz -C /usr/local/bin -f "/tmp/${ASSET}" gitleaks
          gitleaks detect --source . --redact --verbose --exit-code 1

  # 依赖漏洞按语言用原生工具扫锁定文件；不带 --ignore-vuln，有漏洞即阻断。
  python-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3；与 ci.yml 同版本，钉精确版本
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 同步依赖（锁定 uv.lock）
        run: uv sync --locked

      - name: pip-audit
        run: uv run pip-audit

      # 可选 extra 不进默认 env。导出完整锁定解析后按锁定版本审计，
      # 不安装 torch 系依赖（pip-audit 用 PyPI 漏洞数据，无需本地安装）。
      - name: pip-audit（ingest-pdf extra）
        run: |
          set -euo pipefail
          uv export --extra ingest-pdf --no-hashes --no-emit-project \
            --format requirements-txt > "$RUNNER_TEMP/requirements-ingest-pdf.txt"
          uv run pip-audit --no-deps -r "$RUNNER_TEMP/requirements-ingest-pdf.txt"

  rust-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: 安装 cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0

      - name: cargo audit
        run: cargo audit --file ui/src-tauri/Cargo.lock

  sbom-license:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # 许可证元数据只存在于已安装包信息中，先还原 Python/Node 依赖再生成 SBOM。
      - name: 安装 uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 同步 Python 依赖（锁定 uv.lock）
        run: uv sync --locked

      - name: 安装 Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: 安装前端依赖
        working-directory: ui
        run: npm ci

      - name: 生成 SBOM（CycloneDX）
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

      - name: 安装 grant
        run: |
          set -euo pipefail
          VERSION=0.8.0
          ASSET="grant_${VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/anchore/grant/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/${ASSET}" -o "/tmp/${ASSET}"
          curl -sSfL "${BASE}/grant_${VERSION}_checksums.txt" -o /tmp/grant.sha256
          # 校验和与产物同源发布：拦下载损坏与发布元数据不一致，不覆盖上游被攻破
          (cd /tmp && sha256sum -c <(grep "  ${ASSET}\$" grant.sha256))
          tar -xz -C /usr/local/bin -f "/tmp/${ASSET}" grant

      - name: 许可证策略（allowlist；强 copyleft 即阻断）
        run: grant check sbom.cdx.json

  js-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # 优先扫锁定文件（osv-scanner），npm audit 仅作补充：
      # 前者不依赖 registry 凭据，后者会受私有源 401 影响。
      - name: osv-scanner
        run: |
          set -euo pipefail
          VERSION=2.7.1
          ASSET="osv-scanner_linux_amd64"
          BASE="https://github.com/google/osv-scanner/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/${ASSET}" -o "/tmp/${ASSET}"
          curl -sSfL "${BASE}/osv-scanner_SHA256SUMS" -o /tmp/osv-scanner.sha256
          # 校验和与产物同源发布：拦下载损坏与发布元数据不一致，不覆盖上游被攻破
          (cd /tmp && sha256sum -c <(grep "  ${ASSET}\$" osv-scanner.sha256))
          install -m 0755 "/tmp/${ASSET}" /usr/local/bin/osv-scanner
          # 只扫前端锁定文件：Python/Rust 分别由 pip-audit / cargo-audit 负责，
          # 全仓扫描会把 RustSec 的 unmaintained 告警当成漏洞误伤。
          osv-scanner scan source -L ui/package-lock.json

      - name: 安装 Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: npm audit（补充）
        working-directory: ui
        run: npm audit --audit-level=high
