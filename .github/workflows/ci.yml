name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 增量门控:桌面产物相关作业(sandbox 三平台矩阵 / Rust 全链)只在对应路径
  # 变化时才跑——文档、纯 Python 测试或 actions 版本 bump 不值得烧 macOS(×10)
  # /Windows(×2) 计费分钟。判定失败一律放行(fail-open),宁可多跑不漏跑。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sidecar: ${{ steps.filter.outputs.sidecar }}
      rust: ${{ steps.filter.outputs.rust }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            BASE="origin/${GITHUB_BASE_REF}"
          else
            BASE="HEAD~1"
          fi
          if ! git rev-parse -q --verify "${BASE}^{commit}" >/dev/null 2>&1; then
            echo "变更基线不可得,视为全量变更"
            {
              echo "sidecar=true"
              echo "rust=true"
              echo "e2e=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-only "${BASE}...HEAD")
          echo "$FILES"
          match() { echo "$FILES" | grep -Eq "$1" && echo true || echo false; }
          {
            echo "sidecar=$(match '(^src/|^scripts/|^pyproject\.toml$|^uv\.lock$)')"
            echo "rust=$(match '(^ui/src-tauri/)')"
            echo "e2e=$(match '(^src/|^tests/e2e/|^pyproject\.toml$|^uv\.lock$)')"
          } >> "$GITHUB_OUTPUT"

  test:
    name: 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # 测试最低支持版本 3.12 和更新版本 3.14。
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.3.0 # 该仓库不维护 v10 滚动大版本标签，须钉精确版本
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: 同步依赖（锁定 uv.lock）
        run: uv sync --locked

      - name: Ruff Lint
        run: uv run ruff check .

      - name: Ruff Format 检查
        run: uv run ruff format --check .

      - name: 测试
        run: uv run pytest

  # 前端作业仅在 ui/package.json 存在时执行；hashFiles 只能用于 step 级 if。
  ui:
    name: 前端（Node 24）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
        if: ${{ hashFiles('ui/package.json') != '' }}

      - name: 安装依赖
        working-directory: ui
        if: ${{ hashFiles('ui/package.json') != '' }}
        run: npm ci

      - name: Lint / 测试 / 构建
        working-directory: ui
        if: ${{ hashFiles('ui/package.json') != '' }}
        run: npm run lint --if-present && npm test --if-present && npm run build --if-present

  # 桌面壳 Rust 检查：fmt、clippy 和测试。
  # 仅当 ui/src-tauri 路径变化时执行（changes 门控）。
  desktop-shell:
    name: 桌面壳（Rust fmt/clippy/test）
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      # cargo test 链接 tauri 依赖，Linux 上需要 webkit2gtk 系统库
      - name: 安装 Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # tauri-build 会检查 resources 路径；测试使用占位布局。
      - name: 生成 sidecar/UI 资源占位
        run: |
          mkdir -p ui/src-tauri/binaries/siku-sidecar ui/dist
          touch ui/src-tauri/binaries/siku-sidecar/siku-sidecar
          chmod +x ui/src-tauri/binaries/siku-sidecar/siku-sidecar

      - name: Rust 格式检查
        run: cargo fmt --manifest-path ui/src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path ui/src-tauri/Cargo.toml -- -D warnings

      - name: Rust 测试（含无孤儿进程组回收测试）
        run: cargo test --manifest-path ui/src-tauri/Cargo.toml

  # 桌面 sidecar 产物检查（ADR-0013）：三平台真实构建 + 资源/架构/无 torch 门禁。
  # 本作业只验证产物形态，不发布工件。
  # 仅当 sidecar 相关路径（Python 源码/打包脚本/依赖清单）变化时执行（changes 门控）；
  # 注意 ci.yml 自身变更不在触发集内——actions 版本 bump 不影响产物形态。
  sidecar-artifacts:
    name: 桌面 sidecar 产物检查（${{ matrix.os }}）
    needs: changes
    if: needs.changes.outputs.sidecar == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            probe: "--probe"
          - os: ubuntu-22.04
            probe: "--probe"
          # Windows 冻结进程以空 PATH 探针的 DLL 解析行为不做假设，仅结构检查
          - os: windows-latest
            probe: ""
    steps:
      - uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 同步依赖（锁定 uv.lock）
        run: uv sync --locked

      - name: 构建 sidecar（含 pandoc 随包收集与 SHA-256 校验）
        run: uv run python scripts/build_sidecar.py --output dist-check

      - name: 产物清单与二进制检查
        run: >
          uv run python scripts/check_sidecar_artifacts.py dist-check/siku-sidecar
          ${{ matrix.probe }}
