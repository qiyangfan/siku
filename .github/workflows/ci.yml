name: CI

on:
  push:
    branches: [main]
  pull_request:

# Node 运行时说明：以下官方 action（checkout v7 / setup-uv v10 / setup-node v7）
# 均声明 using: node24，由 runner 内置 Node 24 执行 action 包装层；
# ui 作业另经 setup-node 安装 Node 24 作为前端工具链。
# runner 本身的内置 Node 版本由 GitHub 管理无法指定，钉死手段就是选用 node24 版 action。

jobs:
  test:
    name: 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 矩阵取声明范围两端：3.12 = .python-version 钉定的开发基准；3.14 = 当前最新稳定版
      # 阶段一经 uv tool install 分发，用户侧解释器版本异构，两端绿才代表 >=3.12 的声明成立
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.1.0 # 该仓库不维护 v10 滚动大版本标签，须钉精确版本
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: 同步依赖（锁定 uv.lock）
        run: uv sync --locked

      - name: Ruff Lint
        run: uv run ruff check .

      - name: Ruff Format 检查
        run: uv run ruff format --check .

      - name: 测试
        run: uv run pytest

  # ui/ 前端作业：Node 24 工具链；package.json 不存在时所有步骤自动跳过
  # （hashFiles 仅可用于 step 级 if，不能写在 job 级 if，否则整个 workflow 文件校验失败）
  ui:
    name: 前端（Node 24）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
        if: ${{ hashFiles('ui/package.json') != '' }}

      - name: 安装依赖
        working-directory: ui
        if: ${{ hashFiles('ui/package.json') != '' }}
        run: npm ci

      - name: Lint / 测试 / 构建
        working-directory: ui
        if: ${{ hashFiles('ui/package.json') != '' }}
        run: npm run lint --if-present && npm test --if-present && npm run build --if-present

  # 桌面壳 Rust 门禁（Phase 5）：编译错误与生命周期回归不再只能靠打 tag 暴露
  desktop-shell:
    name: 桌面壳（Rust fmt/clippy/test）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # dtolnay/rust-toolchain 的 @stable 是官方维护的滚动分支（区别于 setup-uv 场景）
      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      # cargo test 链接 tauri 依赖，Linux 上需要 webkit2gtk 系统库
      - name: 安装 Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # cargo test 会运行 tauri-build，其校验 tauri.conf.json 的 resources 路径存在性；
      # 本作业不构建真实产物，放占位布局即可（真实产物由 release.yml 构建）
      - name: 生成 sidecar/UI 资源占位
        run: |
          mkdir -p ui/src-tauri/binaries/siku-sidecar ui/dist
          touch ui/src-tauri/binaries/siku-sidecar/siku-sidecar
          chmod +x ui/src-tauri/binaries/siku-sidecar/siku-sidecar

      - name: Rust 格式检查
        run: cargo fmt --manifest-path ui/src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path ui/src-tauri/Cargo.toml -- -D warnings

      - name: Rust 测试（含无孤儿进程组回收测试）
        run: cargo test --manifest-path ui/src-tauri/Cargo.toml
