version: 2
updates:
  # GitHub Actions 版本更新。
  # monthly:每次 bump PR 都会触发 CI;weekly 意味着近乎每周为版本号变更
  # 烧一轮流水线,降频到月度以压缩 Actions 计费分钟。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  # 三套依赖清单分别覆盖：Python（uv.lock）、前端（ui/package-lock.json）、
  # Rust 桌面壳（ui/src-tauri/Cargo.lock）。月度与 Actions 同频，控制流水线消耗。
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "monthly"
  - package-ecosystem: "cargo"
    directory: "/ui/src-tauri"
    schedule:
      interval: "monthly"
